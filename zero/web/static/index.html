<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pi Zero W HID KVM</title>
<style>
html { box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  padding-inline: 8px;
  padding-block: 8px;
  min-block-size: 100dvh;
  block-size: 100dvh;
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: #111;
  color: #eee;
  font-family: ui-sans-serif, system-ui, sans-serif;
  overflow: auto;
  touch-action: manipulation;
}
header { display: flex; align-items: center; gap: 8px; min-inline-size: 0; }
#st { flex: 1; min-inline-size: 0; display: flex; align-items: center; gap: 8px; }
.pill { font-weight: 700; letter-spacing: .06em; font-size: 13px; padding: 2px 8px; border-radius: 999px; background: #2c2c30; color: #aaa; }
.pill.linked { background: #14663a; color: #d8ffe8; }
.pill.keys { background: #1a4e86; color: #d6e8ff; }
.pill.nohost { background: #8a5a10; color: #fff3d6; }
.ip { color: #8cf; font-size: 13px; overflow: clip; }
a { color: #9cf; font-size: 13px; }
header button, #type button { padding-inline: 10px; background: #2c2c30; color: #9cf; }
#type { display: flex; gap: 6px; }
#txt {
  flex: 1;
  min-inline-size: 0;
  font-size: 16px;
  padding: 8px;
  border: 0;
  border-radius: 6px;
  background: #1c1c20;
  color: #eee;
}
#kb { display: flex; flex-direction: column; gap: 2px; }
.row { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 2px; }
button {
  margin: 0;
  min-inline-size: 0;
  border: 0;
  border-radius: 4px;
  padding-block: 9px;
  padding-inline: 0;
  background: #4a4a52;
  color: #fff;
  font-family: inherit;
  font-size: clamp(10px, 2.4vw, 14px);
  line-height: 1.1;
  touch-action: manipulation;
}
button.mod { background: #2c2c30; color: #ddd; }
button.fn { background: #2c2c30; color: #9cf; }
button.go { background: #2a6; color: #042; }
button.sp { background: #5a5a64; }
button.latched { background: #2a6; color: #042; }
button.danger { background: #622; color: #fff; }
button.hw { opacity: .55; }
#pad {
  flex: 1 1 auto;
  min-block-size: 140px;
  display: flex;
  flex-direction: column;
  background: linear-gradient(#2a2d34, #1a1c22);
  border: 1px solid #3a3e48;
  border-radius: 14px;
}
.pad-main { flex: 1; display: flex; min-block-size: 0; }
#surface {
  position: relative;
  flex: 1;
  min-inline-size: 0;
  display: grid;
  place-items: center;
  touch-action: none;
  color: #667;
  letter-spacing: .08em;
  font-size: 12px;
  overflow: hidden;
  border-top-left-radius: 13px;
}
#view {
  position: absolute;
  inset: 0;
  inline-size: 100%;
  block-size: 100%;
  object-fit: contain;
  image-rendering: pixelated;
  pointer-events: none;
  opacity: .88;
}
#loupe {
  position: absolute;
  inset-block-start: 6px;
  inset-inline-end: 6px;
  z-index: 2;
  padding: 4px 8px;
  font-size: 11px;
  background: rgba(20, 24, 34, .82);
  color: #9cf;
  border: 1px solid #3a465e;
  border-radius: 6px;
}
#loupe.active { background: #145266; color: #dff8ff; border-color: #4ad8ff; }
.leds { display: inline-flex; gap: 3px; align-items: center; }
.led {
  font-size: 10px;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 4px;
  background: #22242a;
  color: #556;
  border: 1px solid #333640;
}
.led.on { background: #165e3a; color: #9effc8; border-color: #38d880; }
.scrolls { display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 8px; }
.scrolls button { background: rgba(255, 255, 255, .08); color: #ccc; padding-inline: 12px; }
.pad-btns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 8px; }
.pad-btns button { background: rgba(255, 255, 255, .08); color: #ccc; border-radius: 8px; }
#mode.shell { background: #6a2c7a; color: #f3e0ff; }
#pwr { font-size: 13px; color: #bbb; min-block-size: 1em; }
</style></head><body>
<header>
  <div id="st">
    <span id="pill" class="pill">…</span>
    <span id="leds" class="leds" title="Host Keyboard LEDs (Num / Caps / Scroll)">
      <span id="led-num" class="led">N</span><span id="led-caps" class="led">C</span><span id="led-scroll" class="led">S</span>
    </span>
    <span id="ip" class="ip"></span>
  </div>
  <button type="button" id="ping" title="Bounce CapsLock twice to verify host OS is responsive">Ping</button>
  <button type="button" id="mode" title="Switch the host serial port between helper (stats + still) and a login shell">serial: …</button>
  <a href="term.html">term</a>
  <button type="button" id="pin">PIN</button>
</header>
<div id="type">
  <input id="txt" placeholder="type text or sync clipboard" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <button type="button" id="send" title="Type as US HID keystrokes">Send</button>
  <button type="button" id="clip-push" title="Push UTF-8 text to host clipboard">Clip ↑</button>
  <button type="button" id="clip-pull" title="Pull UTF-8 text from host clipboard">Clip ↓</button>
</div>
<div id="kb"></div>
<div id="pwr"></div>
<div id="pad">
  <div class="pad-main">
    <div id="surface">
      <canvas id="view" width="240" height="135" hidden></canvas>
      <span id="pad-label">TRACKPAD</span>
      <button type="button" id="loupe" title="Toggle live desktop preview / 1:1 cursor loupe on trackpad">view: off</button>
    </div>
    <div class="scrolls">
      <button type="button" id="su" aria-label="Scroll up">↑</button>
      <button type="button" id="sd" aria-label="Scroll down">↓</button>
    </div>
  </div>
  <div class="pad-btns">
    <button type="button" data-b="1">Left</button>
    <button type="button" data-b="4">Middle</button>
    <button type="button" data-b="2">Right</button>
  </div>
</div>
<script src="app.js"></script>
</body></html>
