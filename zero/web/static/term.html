<!doctype html>
<html lang="en" data-theme="slate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KVM USB Serial Terminal</title>
<style>
:root {
  color-scheme: dark;
  --bg: #101010; --cell: #202020; --cell-hi: #303030; --cell-lo: #101010;
  --well: #181818; --lab: #989898; --val: #f0f0f0; --fig: #f0f0f0; --grey: #787878;
  --div: #303030; --rx: #2dd4bf; --tx: #a0a0a8; --ok: #14f05a; --bad: #ff4e60;
  --scrollbar-thumb: var(--grey); --scrollbar-track: var(--well);
  accent-color: var(--lab);
  scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
}
:where([data-theme="braun"]) {
  --bg: #101410; --cell: #383028; --cell-hi: #504c40; --cell-lo: #080808;
  --well: #202018; --lab: #f0b058; --val: #f0f0e0; --fig: #e8e4d8; --grey: #b0a490;
  --div: #484038; --rx: #f0ac38; --tx: #70ccb0; --ok: #5ae046; --bad: #ee443a;
}
:where([data-theme="cobalt"]) {
  --bg: #081420; --cell: #203050; --cell-hi: #305080; --cell-lo: #000810;
  --well: #102030; --lab: #78c4f8; --val: #e8f4f8; --fig: #e0e8f0; --grey: #98acc8;
  --div: #284060; --rx: #48dcf8; --tx: #b08cf8; --ok: #28f096; --bad: #ff4e60;
}
html { box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
.sr-only { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip: rect(0,0,0,0); }
body {
  margin: 0; padding: 8px; min-block-size: 100dvh; block-size: 100dvh;
  display: flex; flex-direction: column; gap: 8px;
  font-family: ui-sans-serif, system-ui, sans-serif;
  background: var(--bg); color: var(--val);
}
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 6px 10px; background: var(--cell);
  border-top: 1px solid var(--cell-hi); border-left: 1px solid var(--cell-hi);
  border-right: 1px solid var(--cell-lo); border-bottom: 1px solid var(--cell-lo);
  border-radius: 8px; user-select: none;
}
a { color: var(--lab); text-decoration: none; font-weight: 600; font-size: 13px; }
button {
  font-family: inherit; font-size: 12px; color: var(--val);
  background: var(--cell); border-top: 1px solid var(--cell-hi); border-left: 1px solid var(--cell-hi);
  border-right: 1px solid var(--cell-lo); border-bottom: 1px solid var(--cell-lo);
  border-radius: 6px; padding: 6px 10px; cursor: pointer;
}
button.go { border-color: var(--ok); }
#st { font: 12px ui-monospace, monospace; color: var(--grey); margin-inline-end: auto; }
#out {
  flex: 1 1 auto; min-block-size: 0; margin: 0;
  background: var(--well); color: var(--rx);
  border: 1px solid var(--div); border-radius: 8px;
  font: 13px/1.35 ui-monospace, SFMono-Regular, monospace;
  overflow: auto; white-space: pre-wrap; padding: 8px 10px;
}
#cmd-form { display: flex; flex-wrap: wrap; gap: 6px; }
#cmd {
  flex: 1 1 220px; min-inline-size: 0; padding: 7px 10px;
  background: var(--well); color: var(--val);
  border: 1px solid var(--div); border-radius: 6px;
  font: 14px ui-monospace, monospace;
}
.note { margin: 0; font-size: 11px; color: var(--grey); }
</style>
</head>
<body>
<header>
  <a href="/">&larr; Cockpit</a>
  <strong style="font-size:13px">Host USB Serial</strong>
  <span id="st">connecting…</span>
  <button type="button" id="mode">serial: …</button>
  <button type="button" id="pin-btn">🔑 PIN</button>
</header>

<pre id="out"></pre>

<form id="cmd-form" autocomplete="off">
  <label for="cmd" class="sr-only">Command to send over USB serial</label>
  <input id="cmd" placeholder="Send command to host serial…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <button type="submit" class="go">Send ⏎</button>
  <button type="button" id="send-raw">No ⏎</button>
  <button type="button" data-ctl="&#x03;">Ctrl+C</button>
  <button type="button" data-ctl="&#x04;">Ctrl+D</button>
</form>
<p class="note">Press <b>serial: helper</b> to switch the helper into an interactive non-root login shell (telemetry pauses until <code>exit</code> or switching back).</p>

<script>
const savedTheme = localStorage.getItem('kvmTheme') || 'slate';
document.documentElement.dataset.theme = savedTheme;

let pin = localStorage.getItem('kvmPin') || '';
const askPin = m => {
  const p = prompt(m || 'Console PIN');
  if (p !== null) { pin = p.trim(); if (pin) localStorage.setItem('kvmPin', pin); else localStorage.removeItem('kvmPin'); }
};
if (!pin) askPin();
document.getElementById('pin-btn').onclick = () => { pin = ''; localStorage.removeItem('kvmPin'); askPin(); };

const out = document.getElementById('out'), st = document.getElementById('st'), cmd = document.getElementById('cmd');
let lastText = '';

async function poll() {
  if (!pin) { st.textContent = 'PIN required'; setTimeout(poll, 700); return; }
  let delay = 700;
  try {
    const r = await fetch('/api/term?n=200', {headers: {'X-KVM-PIN': pin}});
    if (r.status === 401) { pin = ''; localStorage.removeItem('kvmPin'); askPin('Wrong or missing PIN:'); }
    else if (r.status === 429) { st.textContent = 'Locked out (wait 60 s)'; delay = 5000; }
    else if (r.ok) {
      const j = await r.json(), t = j.lines.concat([j.partial]).join('\n');
      st.textContent = j.open ? '● port open' : '○ ' + (j.error || 'port closed');
      if (t !== lastText) {
        const atBottom = out.scrollTop + out.clientHeight >= out.scrollHeight - 20;
        out.textContent = lastText = t;
        if (atBottom) out.scrollTop = out.scrollHeight;
      }
    } else st.textContent = 'HTTP ' + r.status;
  } catch (e) { st.textContent = 'Zero unreachable'; }
  setTimeout(poll, delay);
}

async function postTerm(text, newline) {
  if (!pin) { askPin('Console PIN:'); if (!pin) return; }
  const r = await fetch('/api/term', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'X-KVM-PIN': pin},
    body: JSON.stringify({text, newline})
  });
  if (!r.ok) { const j = await r.json().catch(() => ({})); st.textContent = 'send failed: ' + (j.error || r.status); }
  if (r.status === 401) { pin = ''; localStorage.removeItem('kvmPin'); askPin('Wrong PIN:'); }
}

function send(nl) { postTerm(cmd.value, nl); cmd.value = ''; cmd.focus(); }
document.getElementById('cmd-form').addEventListener('submit', e => { e.preventDefault(); send(true); });
document.getElementById('send-raw').onclick = () => send(false);
cmd.addEventListener('keydown', e => {
  if (e.isComposing || e.keyCode === 229) return;
  if (e.key === 'Enter') { e.preventDefault(); send(true); }
});
document.querySelectorAll('[data-ctl]').forEach(b => { b.onclick = () => postTerm(b.dataset.ctl, false); });

let serialMode = null;
async function modePoll() {
  try {
    const s = await (await fetch('/api/status', {headers: pin ? {'X-KVM-PIN': pin} : {}})).json();
    if (s.ui_theme) { document.documentElement.dataset.theme = s.ui_theme; localStorage.setItem('kvmTheme', s.ui_theme); }
    const b = document.getElementById('mode');
    serialMode = s.serial_mode;
    const pend = s.serial_mode_requested && s.serial_mode_requested !== s.serial_mode;
    b.textContent = 'serial: ' + (serialMode || 'no helper') + (pend ? ' → ' + s.serial_mode_requested + '…' : '');
  } catch (e) {}
  setTimeout(modePoll, 2000);
}
document.getElementById('mode').onclick = async () => {
  if (!pin) { askPin('Console PIN:'); if (!pin) return; }
  const want = serialMode === 'shell' ? 'helper' : 'shell';
  const r = await fetch('/api/mode', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'X-KVM-PIN': pin},
    body: JSON.stringify({mode: want})
  });
  if (r.status === 401) { pin = ''; localStorage.removeItem('kvmPin'); askPin('Wrong PIN:'); return; }
  if (!r.ok) { const j = await r.json().catch(() => ({})); st.textContent = 'mode failed: ' + (j.error || r.status); }
};
poll(); modePoll();
</script>
</body>
</html>
