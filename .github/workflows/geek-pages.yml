name: GEEK firmware -> Pages
"on":
  push:
    branches: [main]
    paths: ["geek/**", "docs/flash/**", "tools/merge-geek-bin.sh", ".github/workflows/geek-pages.yml"]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/cache@v4
        with: { path: ~/.platformio, key: pio-${{ hashFiles('geek/platformio.ini') }} }
      - run: pip install platformio
      - run: tools/merge-geek-bin.sh docs/flash/kvm-geek.bin
      - name: Refuse to publish if a real secrets.h slipped in
        run: test ! -f geek/src/secrets.h
      - uses: actions/upload-artifact@v4
        with: { name: kvm-geek-bin, path: docs/flash/kvm-geek.bin }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}flash/" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
