[platformio]
default_envs = esp32s3geek

; USB build/flash (default). The GEEK's USB-Serial/JTAG port, by id (never ttyACM*).
[env:esp32s3geek]
build_flags =
  ; -DBTN_DOWN=xx -DBTN_SELECT=yy   ; set once the button pins are locked
  ; -DGEEK_THEME=7                  ; 7 is the default theme
platform = espressif32
board = esp32-s3-devkitc-1     ; TODO: closest generic S3 board; verify flash/PSRAM vs your GEEK unit
; Two 3.25 MB OTA app slots (app0/app1) + otadata: room for ~1 MB firmware with OTA.
board_build.partitions = default_8MB.csv
framework = arduino
monitor_speed = 115200
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_84:FC:E6:51:45:F8-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_84:FC:E6:51:45:F8-if00
lib_deps =
  adafruit/Adafruit ST7735 and ST7789 Library
  adafruit/Adafruit GFX Library
  bblanchon/ArduinoJson@^7

; Over-the-air (Wi-Fi) flash. Same build; needs an OTA password saved in the GEEK portal.
;   GEEK_HOST=kvm-geek.local GEEK_OTA_PASS=... pio run -e geek_ota -t upload
; or just: tools/flash-geek.sh ota
[env:geek_ota]
extends = env:esp32s3geek
upload_protocol = espota
upload_port = ${sysenv.GEEK_HOST}
upload_flags =
  --auth=${sysenv.GEEK_OTA_PASS}
  --port=3232
